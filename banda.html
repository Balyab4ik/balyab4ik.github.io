.bubble.hide{opacity:0;transform:translateX(-50%) translateY(10px)}

  padding:.5em 1.2em;background:var(--accent);color:#fff;box-shadow:0 10px 28px -6px var(--accent);transition:transform .2s}
.start button:hover{transform:scale(1.06)}
.start button:focus-visible,.chip:focus-visible,.ctrl:focus-visible{outline:3px solid var(--accent3);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--body);font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:999px;padding:.45em .9em;cursor:pointer;transition:border-color .2s,background .2s}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.ctrl{margin-left:auto;font-family:var(--body);font-weight:700;font-size:14px;border:0;border-radius:999px;padding:.5em 1em;
  background:var(--fg);color:var(--bg);cursor:pointer}
.note{margin:0;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.photo{transition:none}.p,.badge{animation-duration:.01s}}

<body>


<div class="wrap">
  <h1>Наша <span>весёлая</span> банда</h1>
  <p class="sub">Мультик-открытка про Романа, Милану и Мирослава. Нажми «Смотреть» и включи звук.</p>

  <div class="stage" id="stage">
    <div class="photo" id="photo"></div>
    <div class="spot" id="spot"></div>
    <div class="fx" id="fx"></div>
    <div class="rec" id="rec"><i></i>REC</div>
    <div class="bubble hide" id="bubble"></div>
    <div class="start" id="start"><button id="go" type="button">▶ Смотреть</button></div>
  </div>

  <div class="bar" role="group" aria-label="Сцены">
    <button class="chip" type="button" data-s="0" id="c0">🎮 Роман</button>
    <button class="chip" type="button" data-s="1" id="c1">💃 Милана</button>
    <button class="chip" type="button" data-s="2" id="c2">🎤 Мирослав</button>
    <button class="chip" type="button" data-s="3" id="c3">🎉 Все вместе</button>
    <button class="ctrl" type="button" id="snd">🔇 Звук</button>
  </div>
  <p class="note">Сцены меняются сами каждые 5 секунд. Можно нажать на имя, чтобы перейти к нужной.</p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const photo=$('photo'),spot=$('spot'),fx=$('fx'),bubble=$('bubble'),rec=$('rec');
// positions in % of the picture
const R={x:64,y:24}, M={x:32,y:28}, Mi={x:50,y:52};
const scenes=[
  {who:R, z:1.55, sr:'14%', text:'Роман прошёл уже сотый уровень 🎮',
   emo:['🎮','⭐','💥','🏆','👾'], badges:[['LEVEL UP!','#7b5cff'],['+100','#ffb627'],['РЕКОРД!','#ff5c8a']], rec:false},
  {who:M, z:1.55, sr:'15%', text:'Милана снимает новый тикток 💃',
   emo:['💖','💗','❤️','✨','💕'], badges:[['❤ 1 000 000','#ff3b6b'],['В тренде!','#ff5c8a'],['+100 подписчиков','#4cc9f0']], rec:true},
  {who:Mi, z:1.5, sr:'15%', text:'А Мирослав — настоящая рок-звезда 🎤',
   emo:['🎵','🎶','🎤','🎸','⭐'], badges:[['БРАВО!','#ffb627'],['Бис! Бис!','#ff5c8a'],['🎤 Хит!','#7b5cff']], rec:false},
  {who:{x:50,y:42}, z:1.04, sr:'70%', text:'Вместе — самая весёлая банда на свете 💛',
   emo:['🎉','🎊','🎵','💖','🎮','⭐'], badges:[['УРА!','#ff5c8a'],['Лучшие!','#ffb627'],['Банда!','#4cc9f0']], rec:false}
];
let cur=-1,timer=null,spawn=null,playing=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function particle(who,set){
  const s=document.createElement('span');s.className='p';
  s.textContent=set[Math.random()*set.length|0];
  const spread=who===scenes[3].who?40:9;
  s.style.left=(who.x+(Math.random()*2-1)*spread)+'%';
  s.style.top=(who.y+(Math.random()*2-1)*spread*.6)+'%';
  s.style.setProperty('--dx',((Math.random()*2-1)*90)+'px');
  s.style.setProperty('--dy',(-90-Math.random()*130)+'px');
  s.style.setProperty('--rot',((Math.random()*2-1)*40)+'deg');
  s.style.setProperty('--d',(2+Math.random()*1.4)+'s');
  fx.appendChild(s);setTimeout(()=>s.remove(),3600);
}
function badge(who,[t,c],i){
  const b=document.createElement('span');b.className='badge';b.textContent=t;b.style.background=c;
  const off=[[-14,-8],[14,-4],[0,-18]][i%3];
  b.style.left=Math.min(88,Math.max(12,who.x+off[0]))+'%';b.style.top=Math.max(10,who.y+off[1])+'%';
  fx.appendChild(b);setTimeout(()=>b.remove(),2800);
}
function show(i){
  cur=i;const sc=scenes[i];
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.s===i)));
  photo.style.setProperty('--ox',sc.who.x+'%');photo.style.setProperty('--oy',sc.who.y+'%');
  photo.style.setProperty('--z',sc.z);
  spot.style.setProperty('--sx',sc.who.x+'%');spot.style.setProperty('--sy',sc.who.y+'%');spot.style.setProperty('--sr',sc.sr);
  rec.classList.toggle('on',sc.rec);
  bubble.classList.add('hide');
  setTimeout(()=>{bubble.textContent=sc.text;bubble.classList.remove('hide')},350);
  clearInterval(spawn);
  if(!reduce){
    let n=0;spawn=setInterval(()=>{particle(sc.who,sc.emo);if(n%6===2)badge(sc.who,sc.badges[(n/6|0)%3],n/6|0);n++},i===3?160:260);
  }
  sfx(i);
}
function next(){show((cur+1)%scenes.length)}
function play(){playing=true;$('start').hidden=true;show(cur<0?0:cur);clearInterval(timer);timer=setInterval(next,5000);}
$('go').addEventListener('click',()=>{play();if(!audioOn)toggleSound()});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  $('start').hidden=true;playing=true;show(+c.dataset.s);clearInterval(timer);timer=setInterval(next,5000);
}));

/* ---- music: tiny cheerful loop with WebAudio ---- */
let ctx=null,audioOn=false,loopT=null;
const N={C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,G5:784};
const mel=['C5','E5','G5','E5','D5','C5','D5','G4','A4','C5','E5','C5','D5','E5','C5','-'];
const bass=['C4','C4','G4','G4','A4','A4','F4','G4'];
function tone(f,t,d,type='triangle',vol=.08){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.05);
}
function scheduleBar(){
  const t0=ctx.currentTime+.05,step=.22;
  mel.forEach((m,i)=>{if(m!=='-')tone(N[m],t0+i*step,.2,'triangle',.07)});
  bass.forEach((b,i)=>tone(N[b]/2,t0+i*step*2,.38,'sine',.09));
  for(let i=0;i<16;i+=2)tone(1800,t0+i*step,.03,'square',.012);
}
function startMusic(){scheduleBar();loopT=setInterval(scheduleBar,16*220)}
function sfx(i){
  if(!audioOn||!ctx)return;const t=ctx.currentTime;
  if(i===0)['C5','E5','G5','C5'].forEach((m,k)=>tone(N[m]*(k===3?2:1),t+k*.07,.12,'square',.04));
  if(i===1)[0,1,2].forEach(k=>tone(1200+k*300,t+k*.09,.15,'sine',.05));
  if(i===2)tone(N.G5,t,.5,'sawtooth',.03);
  if(i===3)['C5','E5','G5','C5'].forEach((m,k)=>tone(N[m]*(k===3?2:1),t+k*.1,.3,'triangle',.07));
}
function toggleSound(){
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    audioOn=!audioOn;
    if(audioOn){ctx.resume();startMusic();$('snd').textContent='🔊 Звук'}
    else{clearInterval(loopT);$('snd').textContent='🔇 Звук'}
  }catch(e){$('snd').textContent='Звук недоступен'}
}
$('snd').addEventListener('click',toggleSound);

// resting state: a gentle full view with the first caption visible
bubble.textContent='Знакомьтесь: Роман, Милана и Мирослав!';bubble.classList.remove('hide');
})();
</script>
